"quartzProperties":{
  # Core Properties
  "org.quartz.scheduler.instanceName" = GenericAdapterQuartzScheduler
  "org.quartz.scheduler.instanceId" = AUTO
  "org.quartz.jobStore.class" = org.quartz.impl.jdbcjobstore.JobStoreCMT
  "org.quartz.jobStore.driverDelegateClass" = org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
  "org.quartz.jobStore.acquireTriggersWithinLock"=true

  # Configurable Properties
  "org.quartz.scheduler.dbFailureRetryInterval":60000,
  "org.quartz.scheduler.batchTriggerAcquisitionMaxCount":5,
  "org.quartz.scheduler.skipUpdateCheck":true,
  "org.quartz.scheduler.idleWaitTime":60000,
  # Configure ThreadPool
  "org.quartz.threadPool.class":org.quartz.simpl.SimpleThreadPool,
  "org.quartz.threadPool.threadCount":20,
  # Configure JobStore
  "org.quartz.jobStore.misfireThreshold":60000,
  "org.quartz.jobStore.maxMisfiresToHandleAtATime":50,
  "org.quartz.jobStore.txIsolationLevelReadCommitted":true,
  "org.quartz.jobStore.clusterCheckinInterval":120000,
  "org.quartz.jobStore.isClustered":true,
},

"quartzJobCfg":{
   "jobCfgs": [
          {
          "jobName" : "slaBreached",
          "evaluateTime" : "true",
          "evaluatorClass" : "com.sigma.om.quartz.DefaultEvaluatorClass"
          },
          {
          "jobName" : "futureDatedOrder",
          "evaluateTime" : "false"
          },
          {
          "jobName" : "timerEvent",
          "evaluateTime" : "true",
          "evaluatorClass" : "com.sigma.om.ps.quartz.CustomEvaluatorClass"
          },
          {
          "jobName" : "repeatTimer",
          "evaluateTime" : "true"
          }
       ]
}